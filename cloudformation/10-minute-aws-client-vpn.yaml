---
AWSTemplateFormatVersion: "2010-09-09"

Description: |-
  AWS Client VPN

  github.com/sqlxpert/10-minute-aws-client-vpn  GPLv3  Copyright Paul Marcelin

Parameters:

  PlaceholderHelp:
    Type: String
    Default: "github.com/sqlxpert/10-minute-aws-client-vpn"

  PlaceholderSuggestedStackName:
    Type: String
    Default: "CVpn"

  PlaceholderSuggestedStackNamesVpcSubnetAssociationOnly:
    Type: String
    Default: "CVpnSubnet1,CVpnSubnet2,CVpnSubnet3"

  PlaceholderSuggestedStackPolicyBody:
    Type: String
    Default: "https://github.com/sqlxpert/10-minute-aws-client-vpn/blob/main/cloudformation/10-minute-aws-client-vpn-policy.json?raw=true"

  VpnEndpointAndOrVpcSubnetAssociation:
    Type: String
    Description: >-
      Whether this stack defines a VPN endpoint; an association between a VPN
      endpoint and a VPC subnet; or both the VPN endpoint and a VPC subnet
      association.
      The default, "BothVpnEndpointAndVpcSubnetAssociation", yields a
      self-contained VPN stack. To create a second VPC subnet association,
      reference the VPN endpoint in a separate stack.
      Choose "VpcSubnetAssociationOnly" to reference an existing VPN endpoint.
      Choose "VpnEndpointOnly" to create a VPN endpoint that will be referenced
      in a separate stack.
    AllowedValues:
      - BothVpnEndpointAndVpcSubnetAssociation
      - VpcSubnetAssociationOnly
      - VpnEndpointOnly
    Default: BothVpnEndpointAndVpcSubnetAssociation

  VpcId:
    Type: String  # AWS::EC2::VPC::Id cannot be blank
    Description: >-
      The ID of the AWS Virtual Private Cloud (VPC) to which the Virtual
      Private Network (VPN) will connect. This template is for use with a VPN
      endpoint connected directly to a VPC, not one connected through a
      Transit Gateway. This is ignored if VpnEndpointAndOrVpcSubnetAssociation
      is "VpcSubnetAssociationOnly".
    Default: ""

  DestinationIpv4CidrBlock:
    Type: String
    Description: >-
      The range of private IPv4 addresses that VPN clients can reach, in CIDR
      notation. (This "split-tunnel" VPN routes other traffic through a
      client's regular network connection.) Set this to the VPC's IPv4 address
      range, usually the one labeled "IPv4 CIDR" on the VPC details page in the
      AWS Console.
      This is ignored if VpnEndpointAndOrVpcSubnetAssociation is
      "VpcSubnetAssociationOnly".
    Default: ""

  ClientIpv4CidrBlock:
    Type: String
    Description: >-
      The non-overlapping range of private IPv4 addresses available for VPN
      clients, in CIDR notation. It must contain between 1024 and 1 million
      addresses (that is, between /22 and /12 subnet bits). Accept the default,
      10.255.252.0/22, if your AWS VPC and your home/office local-area network
      (LAN) address ranges are in 172.16.X.X or 192.168.X.X, or they do not go
      all the way to the end of 10.X.X.X. Change if your VPC or LAN covers all
      of 10.0.0.0/8 (10.0.0.0 to 10.255.255.255), or a final part such as
      10.128.0.0/9 (10.128.0.0 to 10.255.255.255). This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
    Default: "10.255.252.0/22"

  ServerCertificateArn:
    Type: String
    Description: >-
      The TLS certificate for the VPN server. Specify the ARN of an AWS
      Certificate Manager certificate. This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
    Default: ""

  Enable:
    Type: String
    Description: >-
      Whether to create the association between the VPN endpoint and the VPC
      subnet. This is ignored if VpnEndpointAndOrVpcSubnetAssociation is
      "VpnEndpointOnly".
      For the VPN endpoint to accept connections, an association must be
      defined, and Enable must be set to "true", in at least one stack.
      AWS charges for an association even when no clients are connected.
      (Re-)creating an association takes up to 10 minutes.
      To delete and recreate on a schedule, see
      https://github.com/sqlxpert/lights-off-aws#bonus-delete-and-recreate-expensive-resources-on-a-schedule
    AllowedValues:
      - "false"
      - "true"
    Default: "true"

  TargetSubnetId:
    Type: String  # AWS::EC2::Subnet::Id cannot be blank
    Description: >-
      The ID of a subnet with which the VPN endpoint will be associated. This
      is ignored if VpnEndpointAndOrVpcSubnetAssociation is "VpnEndpointOnly".
      The VPN endpoint and the VPC subnet must be in the same VPC.
      This subnet must contain at least 32 IP addresses
      ( /27 or fewer subnet bits, indicating more addresses), and must have at
      least 8 available addresses. See
      https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/cvpn-working-target.html#cvpn-working-target-associate
    Default: ""

  PlaceholderAdvancedParameters:
    Type: String
    Default: ""
    AllowedValues:
      - ""

  SsmParamPath:
    Type: String
    Description: >-
      A string prepended to the names of the VPN client security group and VPN
      endpoint ID parameters, if AWS Systems Manager (SSM) Parameter Store
      parameters are referenced or set by this stack.
    Default: "/cloudformation"

  ProtocolAndPort:
    Type: String
    Description: >-
      The protocol and port that the VPN will use. UDP is faster but might be
      blocked by intermediate networks. This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
    AllowedValues:
      - "udp 1194"
      - "tcp 443"
    Default: "udp 1194"

  CustomClientSecGrpIds:
    Type: List<String>  # List<AWS::EC2::SecurityGroup::Id> cannot be empty
    Description: >-
      Leave blank to create 2 generic security groups for VPN clients.
      Reference ClientSecGrp (1) in security group ingress rules, to allow
      traffic from VPN clients (FromClientSampleSecGrp serves as an example).
      OutAllSecGrp (2) allows all egress traffic from VPN clients; if the VPN
      is ever compromised, manually remove the VPN from this group to block
      traffic from VPN clients to the VPC.
      If the generic groups do not meet your needs, specify the IDs of 1 or
      more security groups to which VPN clients should be assigned. Separate
      multiple IDs with commas but no spaces. The VPN endpoint and the security
      groups must be in the same VPC.
      This is ignored if VpnEndpointAndOrVpcSubnetAssociation is
      "VpcSubnetAssociationOnly".
    Default: ""

  DnsServerIpv4Addresses:
    Type: List<String>
    Description: >-
      The IPv4 addresses of up to 2 domain name servers for VPN clients to use.
      Separate multiple addresses with a comma but no spaces.
      Leave blank to rely on clients' regular DNS servers.
      DNS server addresses are ignored if VpnEndpointAndOrVpcSubnetAssociation
      is "VpcSubnetAssociationOnly".
      The Amazon name server is 2 addresses above the start of a VPC's address
      range. For example, if the VPC covers CIDR block 10.0.0.0/16 = 10.0.0.0
      to 10.0.255.255, then the Amazon name server is at 10.0.0.2 .
    Default: ""

  ClientRootCertificateChainArn:
    Type: String
    Description: >-
      The TLS certificate chain for VPN client certificates. Specify the ARN
      of an AWS Certificate Manager certificate.  This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
      Leave blank to use the server certificate, in which case clients with any
      certificate signed by the same certificate authority (CA) can connect.
    Default: ""

  RetentionInDays:
    Type: Number
    Description: >-
      How many days to keep VPN connection log entries. This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
      See
      http://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutRetentionPolicy.html
    Default: 7

  CloudWatchLogsKmsKey:
    Type: String
    Description: >-
      If this is blank, default non-KMS CloudWatch Logs encryption applies. To
      use a KMS key, which must be a custom key, specify ACCOUNT:key/KEY_ID.
      This is ignored if VpnEndpointAndOrVpcSubnetAssociation is
      "VpcSubnetAssociationOnly".
      The single-region key, multi-region key primary, or multi-region key
      replica must be in the same region as this stack.
      For a StackSet, the key must be multi-region ("mrk-" prefix in KEY_ID).
      Even if the custom key is in the same AWS account as this stack, you must
      update the key policy to allow usage by CloudWatch Logs. See
      https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/encrypt-log-data-kms.html#cmk-permissions
    Default: ""

  LogGroupPath:
    Type: String
    Description: >-
      The path to prepend to the connection log group name. This is ignored if
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
    Default: "/aws/vpc/clientvpn"

  ExistingEndpointId:
    Type: String
    Description: >-
      The ID of an existing VPN endpoint. This is ignored unless
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly".
      Leave blank if you defined your VPN endpoint in a separate stack created
      from the same template.
    Default: ""

  ExistingEndpointStackName:
    Type: String
    Description: >-
      The name of a separate stack, created with the same template, that
      defines an existing VPN endpoint. This is ignored unless
      VpnEndpointAndOrVpcSubnetAssociation is "VpcSubnetAssociationOnly" and
      ExistingEndpointId is blank. SsmParamPath must be set to the same value
      in both stacks. This stack retrieves the VPN endpoint ID from AWS Systems
      Manager (SSM) Parameter Store, using
      {{resolve:ssm:<SsmParamPath>/<ExistingEndpointStackName>/EndpointId}}
    Default: "CVpn"

Metadata:

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: For Reference
        Parameters:
          - PlaceholderHelp
          - PlaceholderSuggestedStackName
          - PlaceholderSuggestedStackNamesVpcSubnetAssociationOnly
          - PlaceholderSuggestedStackPolicyBody
      - Label:
          default: Required
        Parameters:
          - VpnEndpointAndOrVpcSubnetAssociation
      - Label:
          default: Required for VPN endpoint
        Parameters:
          - VpcId
          - DestinationIpv4CidrBlock
          - ClientIpv4CidrBlock
          - ServerCertificateArn
      - Label:
          default: Required for VPC subnet association
        Parameters:
          - Enable
          - TargetSubnetId
      - Label:
          default: Advanced Options
        Parameters:
          - PlaceholderAdvancedParameters
      - Label:
          default: VPN endpoint and VPC subnet association
        Parameters:
          - SsmParamPath
      - Label:
          default: VPN endpoint
        Parameters:
          - ProtocolAndPort
          - CustomClientSecGrpIds
          - DnsServerIpv4Addresses
          - ClientRootCertificateChainArn
      - Label:
          default: VPN endpoint connection log (CloudWatch)
        Parameters:
          - RetentionInDays
          - CloudWatchLogsKmsKey
          - LogGroupPath
      - Label:
          default: VPC subnet association
        Parameters:
          - ExistingEndpointId
          - ExistingEndpointStackName
    ParameterLabels:
      PlaceholderHelp:
        default: For help with this stack, see
      PlaceholderSuggestedStackName:
        default: Suggested stack name
      PlaceholderSuggestedStackNamesVpcSubnetAssociationOnly:
        default: Suggested stack names - VPC subnet association only
      PlaceholderSuggestedStackPolicyBody:
        default: Copy suggested stack policy from
      VpcId:
        default: VPC ID
      DestinationIpv4CidrBlock:
        default: Destination IP address range
      ClientIpv4CidrBlock:
        default: Client IP address range
      ServerCertificateArn:
        default: TLS certificate ARN for VPN server
      Enable:
        default: Enabled?
      TargetSubnetId:
        default: Subnet ID
      PlaceholderAdvancedParameters:
        default: Do not change parameters below, unless necessary!
      SsmParamPath:
        default: Path for Parameter Store parameters
      ProtocolAndPort:
        default: Network protocol and port
      CustomClientSecGrpIds:
        default: Custom security group(s) for VPN clients
      DnsServerIpv4Addresses:
        default: DNS servers
      ClientRootCertificateChainArn:
        default: TLS certificate ARN for VPN clients
      RetentionInDays:
        default: Retention period (days)
      CloudWatchLogsKmsKey:
        default: KMS encryption key
      LogGroupPath:
        default: Path for log group
      ExistingEndpointId:
        default: Existing Client VPN endpoint ID
      ExistingEndpointStackName:
        default: Name of existing Client VPN endpoint stack

Rules:  # Needed only for conditional parameters with Default: ""

  VpcIdRequired:
    Assertions:
      - AssertDescription: >-
          A VPC ID for the VPN must be specified unless the stack defines a VPC
          subnet association only
        Assert: !Or
          - !Equals
            - !Ref VpnEndpointAndOrVpcSubnetAssociation
            - VpcSubnetAssociationOnly
          - !Not [ !Equals [ !Ref VpcId, "" ] ]

  DestinationIpv4CidrBlockRequired:
    Assertions:
      - AssertDescription: >-
          A destination IPv4 CIDR block for the VPN must be specified unless
          the stack defines a VPC subnet association only
        Assert: !Or
          - !Equals
            - !Ref VpnEndpointAndOrVpcSubnetAssociation
            - VpcSubnetAssociationOnly
          - !Not [ !Equals [ !Ref DestinationIpv4CidrBlock, "" ] ]

  ClientIpv4CidrBlockRequired:
    Assertions:
      - AssertDescription: >-
          A IPv4 CIDR block for VPN clients must be specified unless the stack
          defines a VPC subnet association only
        Assert: !Or
          - !Equals
            - !Ref VpnEndpointAndOrVpcSubnetAssociation
            - VpcSubnetAssociationOnly
          - !Not [ !Equals [ !Ref ClientIpv4CidrBlock, "" ] ]

  ServerCertificateArnRequired:
    Assertions:
      - AssertDescription: >-
          A VPN server certificate must be specified unless the stack defines a
          VPC subnet association only
        Assert: !Or
          - !Equals
            - !Ref VpnEndpointAndOrVpcSubnetAssociation
            - VpcSubnetAssociationOnly
          - !Not [ !Equals [ !Ref ServerCertificateArn, "" ] ]

  TargetSubnetIdRequired:
    Assertions:
      - AssertDescription: >-
          A target VPC subnet ID must be specified unless the stack defines a
          VPN endpoint only
        Assert: !Or
          - !Equals
            - !Ref VpnEndpointAndOrVpcSubnetAssociation
            - VpnEndpointOnly
          - !Not [ !Equals [ !Ref TargetSubnetId, "" ] ]

Conditions:

  CreateEndpoint: !Not
    - !Equals
      - !Ref VpnEndpointAndOrVpcSubnetAssociation
      - VpcSubnetAssociationOnly

  CreateSecGrps: !And
    - !Condition CreateEndpoint
    - !Equals [ !Join [ "", !Ref CustomClientSecGrpIds ], "" ]

  CreateTargetNetAssoc: !And
    - !Equals [ !Ref Enable, "true" ]
    - !Not
      - !Equals [ !Ref VpnEndpointAndOrVpcSubnetAssociation, VpnEndpointOnly ]

  ExistingEndpointIdBlank: !Equals [ !Ref ExistingEndpointId, "" ]

  ClientRootCertificateChainArnBlank:
    !Equals [ !Ref ClientRootCertificateChainArn, "" ]

  CloudWatchLogsKmsKeyBlank: !Equals [ !Ref CloudWatchLogsKmsKey, "" ]

  DnsServerIpv4AddressesBlank:
    !Equals [ !Join [ "", !Ref DnsServerIpv4Addresses ], "" ]

Resources:

  OutAllSecGrp:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecGrps
    Properties:
      GroupDescription: >-
        All egress. If VPN is accessed by an unauthorized client, detach this
        security group from VPN endpoint to block new requests from all VPN
        clients.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"  # All
          CidrIp: 0.0.0.0/0  # All
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-OutAllSecGrp"

  ClientSecGrp:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecGrps
    Properties:
      GroupDescription: !Sub >-
        ${AWS::StackName} client. Reference in security group ingress rules to
        accept requests from VPN clients.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: >-
            Placeholder to replace default egress rule. Use a separate security
            group for outbound traffic.
          IpProtocol: "-1"  # All
          CidrIp: 127.0.0.1/32  # Loopback
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ClientSecGrp"

  ClientSecGrpIdParam:
    Type: AWS::SSM::Parameter
    Condition: CreateSecGrps
    Properties:
      Name: !Sub "${SsmParamPath}/${AWS::StackName}/ClientSecGrpId"
      Description: !Sub >-
        ${AWS::StackName} client security group ID. Reference value in security
        group ingress rules to accept requests from VPN clients.
        CloudFormation:
        {{!resolve:ssm:${SsmParamPath}/${AWS::StackName}/ClientSecGrpId}}
        without exclamation mark.
        Terraform:
        data "aws_ssm_parameter" "vpn_client_security_group_id" {
          name = "${SsmParamPath}/${AWS::StackName}/ClientSecGrpId"
        }
        .
        To avoid a dependency, pre-define security groups and set
        CustomClientSecGrpIds before before creating VPN endpoint.
      DataType: text
      Type: String
      Value: !GetAtt ClientSecGrp.GroupId

  FromClientSampleSecGrp:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateSecGrps
    Properties:
      GroupDescription: !Sub >-
        Server for ${AWS::StackName} clients
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: >-
            Placeholder to replace default egress rule. Use a separate security
            group for outbound traffic.
          IpProtocol: "-1"  # All
          CidrIp: 127.0.0.1/32  # Loopback
      SecurityGroupIngress:
        - Description: !Sub "${AWS::StackName} client"
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref ClientSecGrp
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-FromClientSampleSecGrp"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateEndpoint
    DeletionPolicy: Delete  # Set Enable false to keep stack until logs expire
    Properties:
      LogGroupName: !Sub "${LogGroupPath}/${AWS::StackName}"
      RetentionInDays: !Ref RetentionInDays
      KmsKeyId: !If
        - CloudWatchLogsKmsKeyBlank
        - !Ref AWS::NoValue
        - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${CloudWatchLogsKmsKey}"

  LogStream:
    Type: AWS::Logs::LogStream
    Condition: CreateEndpoint
    Properties:
      LogGroupName: !Ref LogGroup
      LogStreamName: connect

  Endpoint:
    Type: AWS::EC2::ClientVpnEndpoint
    Condition: CreateEndpoint
    Properties:
      Description: !Sub "${AWS::StackName}"
      SelfServicePortal: disabled  # Not available with mutual TLS auth.
      ConnectionLogOptions:
        Enabled: true
        CloudwatchLogGroup: !Ref LogGroup
        CloudwatchLogStream: !Ref LogStream
      ServerCertificateArn: !Ref ServerCertificateArn
      AuthenticationOptions:
        - Type: certificate-authentication
          MutualAuthentication:
            ClientRootCertificateChainArn: !If
              - ClientRootCertificateChainArnBlank
              - !Ref ServerCertificateArn
              - !Ref ClientRootCertificateChainArn
      TransportProtocol: !Select [ 0, !Split [ " ", !Ref ProtocolAndPort ] ]
      VpnPort: !Select [ 1, !Split [ " ", !Ref ProtocolAndPort ] ]
      ClientCidrBlock: !Ref ClientIpv4CidrBlock
      VpcId: !Ref VpcId
      DnsServers: !If
        - DnsServerIpv4AddressesBlank
        - !Ref AWS::NoValue
        - !Ref DnsServerIpv4Addresses
      SecurityGroupIds: !If
        - CreateSecGrps
        -
          - !Ref ClientSecGrp
          - !Ref OutAllSecGrp
        - !Ref CustomClientSecGrpIds
      SplitTunnel: true
      TagSpecifications:
        - ResourceType: client-vpn-endpoint
          Tags:
            - Key: Name
              Value: !Ref AWS::StackName
              # As of 2026-05, CloudFormation does not set default tags such as
              # aws:cloudformation:stack-name for this resource type.
    Metadata:
      cfn-lint: { config: { ignore_checks: [ W1030 ] } }
      # VpcIdRequired rule ensures VpcId is not blank if it's needed. Suppress
      # {'Ref': 'VpcId'} is not a 'AWS::EC2::VPC.Id' with pattern
      # '^vpc-(([0-9A-Fa-f]{8})|([0-9A-Fa-f]{17}))$' when 'Ref' is resolved

  EndpointIdParam:
    Type: AWS::SSM::Parameter
    Condition: CreateEndpoint
    Properties:
      Name: !Sub "${SsmParamPath}/${AWS::StackName}/EndpointId"
      Description: !Sub >-
        ${AWS::StackName} endpoint ID.
        AWS CLI:
        aws ec2 export-client-vpn-client-configuration --output text --client-vpn-endpoint-id 'cvpn-endpoint-00123456789abcdef'
        .
        CloudFormation:
        {{!resolve:ssm:${SsmParamPath}/${AWS::StackName}/EndpointId}}
        without exclamation mark.
        Terraform:
        data "aws_ssm_parameter" "client_vpn_endpoint_id" {
          name = "${SsmParamPath}/${AWS::StackName}/EndpointId"
        }
        .
        To avoid a hard dependency, find by client VPN endpoint by tag: Name =
        "${AWS::StackName}".
      DataType: text
      Type: String
      Value: !Ref Endpoint

  AuthRule:
    Type: AWS::EC2::ClientVpnAuthorizationRule
    Condition: CreateEndpoint
    Properties:
      ClientVpnEndpointId: !Ref Endpoint
      Description: !Sub "${VpcId}"
      AuthorizeAllGroups: true
      TargetNetworkCidr: !Ref DestinationIpv4CidrBlock

  TargetNetAssoc:
    Type: AWS::EC2::ClientVpnTargetNetworkAssociation
    Condition: CreateTargetNetAssoc
    Properties:
      ClientVpnEndpointId: !If
        - CreateEndpoint
        - !Ref Endpoint
        - !If
          - ExistingEndpointIdBlank
          - !Sub "{{resolve:ssm:${SsmParamPath}/${ExistingEndpointStackName}/EndpointId}}"
          - !Ref ExistingEndpointId
      SubnetId: !Ref TargetSubnetId
      # A default AWS::EC2::ClientVpnRoute from this subnet to
      # ClientVpnAuthRule.TargetNetworkCidr = DestinationIpv4CidrBlock
      # is automatically created upon association
    Metadata:
      cfn-lint: { config: { ignore_checks: [ W1030 ] } }
      # TargetSubnetIdRequired rule ensures TargetSubnetId is not blank if it's
      # needed. Suppress
      # W1030 {'Ref': 'TargetSubnetId'} is not a 'AWS::EC2::Subnet.Id' with
      # pattern '^[\\.\\-_\\/#A-Za-z0-9]{1,512}\\Z' when 'Ref' is resolved
